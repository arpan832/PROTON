<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app/calculator/calculator.css">
    <link rel="stylesheet" href="app/Notepad/Notepad.css">
    <!-- Spidey OS New System -->
    <link rel="stylesheet" href="app/shared/spidey-window.css">
    <link rel="stylesheet" href="app/shared/desktop-overrides.css">
    <link rel="stylesheet" href="app/taskbar/taskbar.css">
    <link rel="stylesheet" href="app/weather/weather.css">
    <link rel="stylesheet" href="app/bugle/bugle.css">
    <title>SPIDEY OS // Proto</title>
</head>
<body>
    <!-- BOOT SCREEN - Preserved -->
    <div class="text">
        <h1>
            <div id="type" class="typewrite" data-period="2000" data-type='[ "SpideyOs" , "clickit" ]'></div>
            <span class="wrap"></span>
        </h1>
        <div id="clock" class="Hidden">00:00:00</div>
        <div id="Dati" class="Hidden">Date..</div>
    </div>

    <!-- DESKTOP - Preserved + Extended -->
    <div class="Hidden" id="Desktop">
        <img src="desktop.jpg" alt="Spidey OS Desktop" class="Desktop">

        <!-- Top HUD Bar -->
        <div id="spidey-topbar">
            <div id="spidey-topbar-left">
                <div id="spidey-topbar-logo">🕷️ SPIDEY <span>OS</span></div>
                <span style="opacity:0.4;">•</span>
                <span id="spidey-topbar-status">Friendly Neighborhood System • v2.0</span>
            </div>
            <div id="spidey-topbar-center">
                <span id="spidey-topbar-clock">00:00:00</span>
                <span style="opacity:0.3;">|</span>
                <span id="spidey-topbar-date">Loading...</span>
            </div>
            <div id="spidey-topbar-right">
                <span style="display:flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;background:#0f0;border-radius:50%;box-shadow:0 0 6px #0f0;display:inline-block;"></span> Web-Sync Active</span>
            </div>
        </div>

        <!-- Window Layer for new apps -->
        <div id="window-layer"></div>

        <!-- Floating App Buttons - Preserved (right side) -->
        <div class="apps" id="legacy-apps-dock">
            <div class="notepad" id="note-box" role="button" aria-label="Open notepad" title="Notepad">
                <img src="Notepad.jpg" alt="Notepad icon" class="note-icon">
            </div>
            <div class="calculator" id="cal-box" role="button" aria-label="Open calculator" title="Calculator">
                <img src="calculator (2).jpg" alt="Calculator icon" class="calc">
            </div>
        </div>

        <!-- Legacy Panels - Preserved, now managed by WindowManager -->
        <div class="notepad-panel" id="note-bigbox" aria-hidden="true">
            <div class="notepad-window">
                <div class="notepad-header">
                    <span>Notepad</span>
                    <button id="note-close" type="button" aria-label="Close notepad">×</button>
                </div>
                <textarea id="note-textarea" placeholder="Type your notes here..."></textarea>
                <button id="save-note" type="button" aria-label="Save note">Save</button>
            </div>
        </div>

        <div class="calculator-panel" id="cal-bigbox" aria-hidden="true">
            <div class="calculator-window">
                <div class="calculator-header">
                    <span>Calculator</span>
                    <button id="calc-close" type="button" aria-label="Close calculator">×</button>
                </div>
                <div class="calculator-screen" id="calc-screen">0</div>
                <div class="calculator-keys">
                    <button type="button" data-action="clear">C</button>
                    <button type="button" data-action="plusminus">±</button>
                    <button type="button" data-action="percent">%</button>
                    <button type="button" class="operator" data-action="operator" data-value="/">÷</button>
                    <button type="button" data-action="digit" data-value="7">7</button>
                    <button type="button" data-action="digit" data-value="8">8</button>
                    <button type="button" data-action="digit" data-value="9">9</button>
                    <button type="button" class="operator" data-action="operator" data-value="*">×</button>
                    <button type="button" data-action="digit" data-value="4">4</button>
                    <button type="button" data-action="digit" data-value="5">5</button>
                    <button type="button" data-action="digit" data-value="6">6</button>
                    <button type="button" class="operator" data-action="operator" data-value="-">-</button>
                    <button type="button" data-action="digit" data-value="1">1</button>
                    <button type="button" data-action="digit" data-value="2">2</button>
                    <button type="button" data-action="digit" data-value="3">3</button>
                    <button type="button" class="operator equals" data-action="equals">=</button>
                    <button type="button" data-action="digit" data-value="0" style="grid-column: span 2;">0</button>
                    <button type="button" data-action="decimal" data-value=".">.</button>
                </div>
            </div>
        </div>

        <!-- Taskbar Root -->
        <div id="taskbar-root"></div>
    </div>

    <!-- Scripts: Order matters -->
    <script src="script.js"></script>
    <!-- Services -->
    <script src="app/weather/weatherService.js"></script>
    <script src="app/bugle/fallbackData.js"></script>
    <script src="app/bugle/newsService.js"></script>
    <!-- App Components -->
    <script src="app/stubs/stubs.js"></script>
    <script src="app/weather/weather.js"></script>
    <script src="app/bugle/bugle.js"></script>
    <!-- Core OS -->
    <script src="app/registry.js"></script>
    <script src="app/windowManager.js"></script>
    <script src="app/taskbar/taskbar.js"></script>
    <!-- Legacy Apps (now integrated) -->
    <script src="app/calculator/calculator.js"></script>
    <script src="app/Notepad/Notepad.js"></script>
    <!-- Integration Layer -->
    <script src="app/shared/integration.js"></script>
</body>
</html>
